name: Build Windows EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r packaging/requirements-build.txt

      - name: Verify frontend build input
        shell: pwsh
        run: |
          $indexFile = "frontend/dist/index.html"
          if (-not (Test-Path $indexFile)) {
            throw "frontend/dist/index.html was not generated"
          }
          $indexHtml = Get-Content -Raw $indexFile
          $assetMatches = [regex]::Matches($indexHtml, 'src="(/app/assets/[^"]+\.js)"')
          if ($assetMatches.Count -eq 0) {
            throw "frontend/dist/index.html does not reference a /app/assets/*.js entrypoint"
          }
          foreach ($match in $assetMatches) {
            $assetRelativePath = $match.Groups[1].Value -replace '^/app/', '' -replace '/', '\\'
            if (-not (Test-Path (Join-Path "frontend/dist" $assetRelativePath))) {
              throw "Frontend entry asset is missing: $assetRelativePath"
            }
          }

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm --log-level=INFO packaging/ExcelWorkflow.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ExcelWorkflow.exe")) {
            throw "dist/ExcelWorkflow.exe was not generated"
          }

      - name: Install Electron dependencies
        run: npm install

      - name: Build Electron installer
        run: npm run dist

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelWorkflow-windows-x64
          path: dist/ExcelWorkflow.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ExcelWorkflow-electron-windows-x64
          path: release/*
          if-no-files-found: error
          retention-days: 30
