name: Build Windows EXE

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            packaging/requirements-build.txt

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Prepare frontend assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "backend/frontend/dist" | Out-Null
          Copy-Item -Recurse -Force "frontend/dist/*" "backend/frontend/dist"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install -r packaging/requirements-build.txt

      - name: Build EXE
        run: python -m PyInstaller --clean --noconfirm packaging/ExcelWorkflow.spec

      - name: Verify EXE
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/ExcelWorkflow.exe")) {
            throw "dist/ExcelWorkflow.exe was not generated"
          }

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: ExcelWorkflow-windows-x64
          path: dist/ExcelWorkflow.exe
          if-no-files-found: error
          retention-days: 30
